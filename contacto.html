<script>
const form = document.getElementById("contactForm");
const result = document.getElementById("result");
form.addEventListener("submit", function(e) {
    e.preventDefault();
    result.innerHTML = "Enviando...";
    fetch("https://api.web3forms.com/submit", {
        method: "POST",
        body: new FormData(form)
    })
    .then(r => r.json())
    .then(data => {
        if (data.success) {
            result.innerHTML = "Mensaje enviado correctamente";
            form.reset();
        } else {
            result.innerHTML = "Error al enviar el mensaje";
        }
    })
    .catch(() => {
        result.innerHTML = "Error de conexión";
        result.style.color = "red";
    });
});
</script>

<script>
const menuToggle = document.getElementById('menu-toggle');
const menuIcon = document.getElementById('menu-icon');
const mobileMenu = document.getElementById('mobile-menu');
let menuOpen = false;

menuToggle.addEventListener('click', () => {
    menuOpen = !menuOpen;
    menuToggle.setAttribute('aria-expanded', menuOpen);
    menuIcon.textContent = menuOpen ? '✕' : '☰';

    if (menuOpen) {
        mobileMenu.style.height = "auto";
        const h = mobileMenu.offsetHeight;
        mobileMenu.style.height = "0px";
        mobileMenu.offsetHeight;
        gsap.to(mobileMenu, { height: h, duration: 0.5, ease: "power2.out" });
    } else {
        gsap.to(mobileMenu, {
            height: 0,
            duration: 0.4,
            ease: "power2.in",
            onComplete: () => { mobileMenu.style.height = "0px"; }
        });
    }
});
</script>

<script type="module">
import * as THREE from "three";

function initPixelatedBg(container, videoEl) {
    const mouse = { prevX: 0.5, prevY: 0.5 };
    const S = { grid: 100, radius: 0.1, strength: 1, relaxation: 0.94 };
    let W = container.offsetWidth, H = container.offsetHeight;
    const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 10);
    camera.position.z = 1;

    const texture = new THREE.VideoTexture(videoEl);
    texture.minFilter = THREE.NearestFilter;
    texture.magFilter = THREE.NearestFilter;
    texture.wrapS = THREE.ClampToEdgeWrapping;
    texture.wrapT = THREE.ClampToEdgeWrapping;
    texture.generateMipmaps = false;

    const size = S.grid;
    const data = new Float32Array(size * size * 4);
    for (let i = 0; i < data.length; i += 4) { data[i] = 0; data[i + 1] = 0; data[i + 2] = 0; data[i + 3] = 1; }
    const dataTex = new THREE.DataTexture(data, size, size, THREE.RGBAFormat, THREE.FloatType);
    dataTex.magFilter = THREE.NearestFilter;
    dataTex.minFilter = THREE.NearestFilter;
    dataTex.needsUpdate = true;

    const material = new THREE.ShaderMaterial({
        uniforms: { uTexture: { value: texture }, uDataTexture: { value: dataTex }, uGrid: { value: S.grid } },
        vertexShader: `varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position,1.0);}`,
        fragmentShader: `
            uniform sampler2D uTexture;
            uniform sampler2D uDataTexture;
            uniform float uGrid;
            varying vec2 vUv;
            void main(){
                vec2 pixelUv=floor(vUv*uGrid)/uGrid;
                vec2 offset=texture2D(uDataTexture,pixelUv).rg;
                gl_FragColor=texture2D(uTexture,pixelUv-offset*0.6);
            }
        `
    });

    const scene = new THREE.Scene();
    scene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), material));

    const renderer = new THREE.WebGLRenderer({ antialias: false, alpha: true });
    renderer.setSize(W, H);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    function paintTrail(fx, fy, tx, ty) {
        const d = dataTex.image.data;
        const sx = fx * size, sy = (1 - fy) * size, ex = tx * size, ey = (1 - ty) * size;
        const dx = ex - sx, dy = ey - sy, dist = Math.sqrt(dx * dx + dy * dy), steps = Math.ceil(dist);
        for (let i = 0; i <= steps; i++) {
            const t = i / steps, x = sx + dx * t, y = sy + dy * t;
            const R = size * S.radius, R2 = R * R;
            for (let iy = 0; iy < size; iy++) {
                for (let ix = 0; ix < size; ix++) {
                    const px = ix - x, py = iy - y, d2 = px * px + py * py;
                    if (d2 < R2) {
                        const idx = 4 * (ix + iy * size), f = 1 - d2 / R2;
                        d[idx] += dx * 0.002 * f * S.strength;
                        d[idx + 1] -= dy * 0.002 * f * S.strength;
                    }
                }
            }
        }
        dataTex.needsUpdate = true;
    }

    const isTouch = window.matchMedia("(pointer: coarse)").matches;
    const handleMove = (cx, cy) => {
        const r = container.getBoundingClientRect();
        const x = (cx - r.left) / r.width, y = (cy - r.top) / r.height;
        paintTrail(mouse.prevX, mouse.prevY, x, y);
        mouse.prevX = x; mouse.prevY = y;
    };

    if (!isTouch) {
        container.addEventListener("pointermove", e => handleMove(e.clientX, e.clientY));
    } else {
        let touching = false;
        container.addEventListener("pointerdown", e => {
            touching = true;
            const r = container.getBoundingClientRect();
            mouse.prevX = (e.clientX - r.left) / r.width;
            mouse.prevY = (e.clientY - r.top) / r.height;
        });
        container.addEventListener("pointermove", e => { if (touching) handleMove(e.clientX, e.clientY); });
        ["pointerup","pointercancel"].forEach(ev => container.addEventListener(ev, () => { touching = false; }));
    }

    window.addEventListener("resize", () => {
        W = container.offsetWidth; H = container.offsetHeight;
        renderer.setSize(W, H);
    });

    (function render() {
        const d = dataTex.image.data;
        for (let i = 0; i < d.length; i += 4) { d[i] *= S.relaxation; d[i + 1] *= S.relaxation; }
        dataTex.needsUpdate = true;
        renderer.render(scene, camera);
        requestAnimationFrame(render);
    })();
}

const video = document.getElementById("pixel-video");
function boot() {
    document.querySelectorAll(".pixelated-bg").forEach(c => initPixelatedBg(c, video));
}
if (video.readyState >= 2) boot();
else video.addEventListener("loadeddata", boot, { once: true });
</script>
